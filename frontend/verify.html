<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Certificate Verification | CertiGen</title>
    <link rel="stylesheet" href="/styles.css">
</head>
<body class="verify-page">
    <main class="verify-shell">
        <section class="verify-card">
            <div id="verifyBadge" class="verify-badge">Checking</div>
            <h1 id="verifyTitle">Checking certificate</h1>
            <p id="verifyMessage">Please wait while we verify this certificate.</p>
            <div id="verifyGrid" class="verify-grid hidden"></div>
        </section>
    </main>

    <script>
        // This keeps certificate values safe before showing them on the page.
        function escapeHtml(value) {
            return String(value ?? "")
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#39;");
        }

        // This creates one small info box for the verification result.
        function renderItem(label, value) {
            return `
                <div class="verify-item">
                    <div class="verify-label">${escapeHtml(label)}</div>
                    <div class="verify-value">${escapeHtml(value || "-")}</div>
                </div>
            `;
        }

        // This loads the registration number from the URL and checks it with the API.
        async function loadVerification() {
            const regNo = decodeURIComponent(window.location.pathname.split("/").pop() || "");
            const badge = document.getElementById("verifyBadge");
            const title = document.getElementById("verifyTitle");
            const message = document.getElementById("verifyMessage");
            const grid = document.getElementById("verifyGrid");

            try {
                const res = await fetch(`/api/verify/${encodeURIComponent(regNo)}`);
                const data = await res.json();

                if (!res.ok || !data.verified) {
                    document.body.classList.add("verify-invalid");
                    badge.textContent = "Invalid";
                    badge.classList.add("invalid");
                    title.textContent = "Certificate Invalid";
                    message.textContent = data.message || `No valid certificate record was found for registration number ${regNo}.`;
                    grid.classList.add("hidden");
                    return;
                }

                const certificate = data.certificate || {};
                badge.textContent = "Verified";
                badge.classList.add("verified");
                title.textContent = "Certificate Valid";
                message.textContent = "This certificate was generated by CertiGen and matches our records.";
                grid.innerHTML = [
                    renderItem("Candidate Name", certificate.name),
                    renderItem("Registration Number", certificate.reg_no),
                    renderItem("Roll Number", certificate.roll_number),
                    renderItem("He / She", certificate.he_she),
                    renderItem("Course Name", certificate.course_name),
                    renderItem("Course Type", certificate.course_type),
                    renderItem("Start Date", certificate.start_date),
                    renderItem("End Date", certificate.end_date),
                    renderItem("Score Achieved", certificate.score),
                    certificate.email ? renderItem("Email", certificate.email) : ""
                ].join("");
                grid.classList.remove("hidden");
            } catch (error) {
                document.body.classList.add("verify-invalid");
                badge.textContent = "Error";
                badge.classList.add("invalid");
                title.textContent = "Verification Failed";
                message.textContent = "We could not verify this certificate right now.";
                grid.classList.add("hidden");
                console.error(error);
            }
        }

        // This starts verification as soon as the page opens.
        loadVerification();
    </script>
</body>
</html>
